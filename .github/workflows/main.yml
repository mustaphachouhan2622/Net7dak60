name: Build Net7dak 60 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q Net7dak60_V2_1.zip -d project
          find project -maxdepth 4 -type f | head -100

      - name: Find Android project
        run: |
          if [ -f "project/app/build.gradle" ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          elif [ -f "project/Net7dak60/app/build.gradle" ]; then
            echo "PROJECT_DIR=project/Net7dak60" >> "$GITHUB_ENV"
          else
            echo "Android project not found"
            find project -name "build.gradle" -o -name "build.gradle.kts"
            exit 1
          fi

            - name: Force Java 17
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> gradle.properties

          cat >> gradle.properties <<'EOF'
          android.suppressUnsupportedCompileSdk=35
          EOF

          cat >> build.gradle <<'EOF'

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = "17"
                  }
              }
          }
          EOF

          echo "=== Java/Kotlin configuration ==="
          grep -R "VERSION_1_8\|jvmTarget\|sourceCompatibility\|targetCompatibility" app/build.gradle build.gradle || true    - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon :app:assembleDebug
          else
            gradle --no-daemon :app:assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Net7dak60-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
